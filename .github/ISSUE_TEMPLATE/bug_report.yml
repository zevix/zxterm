name: Bug report
description: Something in zxterm-core does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `zxterm-core --version`, and the ZBTerm version if you use it through ZBTerm.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: e.g. Ubuntu 24.04 x64, macOS 15 arm64
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Remove anything private first.
      render: text
