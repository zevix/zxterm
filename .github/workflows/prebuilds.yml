# Builds the `zxterm-core` sidecar for every target ZBTerm ships and stages
# each binary as `prebuilds/<platform>-<arch>/zxterm-core`. On a `v*` tag the
# `publish` job assembles all of them into the `zxterm-core-prebuilds` npm
# package and publishes it; on a manual run it only uploads the artifacts.
#
# Publishing uses npm trusted publishing (OIDC): configure this repository and
# workflow as a trusted publisher of `zxterm-core-prebuilds` on npmjs.com, or
# set an `NPM_TOKEN` secret in the `npm` environment for the first release.
#
# Windows is not a target yet: the sidecar's named-pipe listener and its
# SSH-agent client are Unix-only.
name: prebuilds

on:
  workflow_dispatch:
  push:
    tags:
      - v*

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.dir }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { triple: x86_64-unknown-linux-gnu, runner: ubuntu-22.04, dir: linux-x64 }
          - { triple: aarch64-unknown-linux-gnu, runner: ubuntu-22.04-arm, dir: linux-arm64 }
          - { triple: aarch64-apple-darwin, runner: macos-latest, dir: darwin-arm64 }
          - { triple: x86_64-apple-darwin, runner: macos-26-intel, dir: darwin-x64 }
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (rust-toolchain.toml) and target
        shell: bash
        run: |
          rustup show active-toolchain
          rustup target add ${{ matrix.triple }}
      - name: Build and stage the prebuild
        shell: bash
        run: scripts/build-prebuilds.sh ${{ matrix.triple }}
      - name: Smoke test
        shell: bash
        run: npm/zxterm-core-prebuilds/prebuilds/${{ matrix.dir }}/zxterm-core --version
      - uses: actions/upload-artifact@v4
        with:
          name: zxterm-core-${{ matrix.dir }}
          path: npm/zxterm-core-prebuilds/prebuilds/${{ matrix.dir }}/
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          pattern: zxterm-core-*
          path: artifacts
      - name: Assemble the package
        shell: bash
        run: |
          set -euo pipefail
          pkg=npm/zxterm-core-prebuilds
          version="$(node -p "require('./$pkg/package.json').version")"
          crate="$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/zxterm-core/Cargo.toml | head -1)"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ] || [ "$crate" != "$tag" ]; then
            echo "tag $GITHUB_REF_NAME, package.json $version and Cargo.toml $crate must all match" >&2
            exit 1
          fi
          for dir in linux-x64 linux-arm64 darwin-arm64 darwin-x64; do
            mkdir -p "$pkg/prebuilds/$dir"
            cp "artifacts/zxterm-core-$dir/zxterm-core" "$pkg/prebuilds/$dir/zxterm-core"
            # Artifacts do not keep file modes.
            chmod 0755 "$pkg/prebuilds/$dir/zxterm-core"
          done
          cp LICENSE THIRD-PARTY-NOTICES.md "$pkg/"
          (cd "$pkg" && npm pack --dry-run)
      - name: Publish
        working-directory: npm/zxterm-core-prebuilds
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
