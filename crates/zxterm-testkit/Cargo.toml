[package]
name = "zxterm-testkit"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
# K5: contracts.rs reads and verifies ZBTerm's `contracts/hashes.json`
# manifest against the raw `.wasm` bytes at test time (no `include_bytes!`
# yet — that is K10's `A-6`).
blake3 = "1"
serde_json = "1"
